# ─── nginx-конфиг для фронта ──────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Прокси на Django-бэк.
    # 'backend' — это имя сервиса в docker-compose, оно резолвится во внутренний IP.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Транзакции могут идти долго — увеличиваем таймауты.
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # SPA fallback: все маршруты, которых нет среди файлов,
    # отдают index.html — это нужно для react-router.
    # Без этого при F5 на /elections/1 nginx отдаст 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Простые оптимизации
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}
